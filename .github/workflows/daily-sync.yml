name: Sync Live Promotions (PostgreSQL & JSON Fallback)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  sync-promotions:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Google Chrome for Cloudflare Bypass (Zero GPG)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using pre-installed Chrome: $(google-chrome --version)"
          else
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb
          fi

      - name: Install backend dependencies
        working-directory: ./server
        run: npm install

      - name: Run Live Supermarket Price Sync
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node test-sync.js

      - name: Commit and push updated promotions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git add server/db/local-store.json
          if git diff --staged --quiet; then
            echo "No changes in local-store.json to commit."
          else
            git commit --no-gpg-sign -m "chore(sync): auto-update live supermarket promotions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi